<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="pokemon.css">
    <script src="pokemon.js" defer></script>
</head>
<body>
    <main class="stage">
        <header class="head">
            <h1>Pokédex</h1>
            <p class="lede">Nombre, peso e imagen de cada espécimen.</p>
        </header>

        <label class="search">
            Buscar Pokémon
            <input
                type="search"
                name="pokemon"
                placeholder="Ejemplo: ditto"
                autocomplete="off"
                spellcheck="false"
                id="search"
            >
        </label>

        <section id="pokemon-list" class="dex" aria-label="Lista de Pokémon">
            <article class="pokemon-card" data-name="ditto">
                <div class="viewport">
                    <img id="pokemon-image"
                        src=""
                        alt="pokemon-image"
                    >
                </div>
                <h2 id="pokemon-name">Ejemplo</h2>
                <p id="pokemon-weight" class="weight">
                    <span>Peso</span> -- kg
                </p>
                <p id="pokemon-height" class="weight"><span>Altura</span> -- cm</p>
            </article>
        </section>
    </main>
</body>
</html>
