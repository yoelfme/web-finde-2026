<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Basics</title>

    <link rel="stylesheet" href="basics.css">
    <link rel="icon" href="assets/favicon.ico">
     <!-- <link rel="icon" href="https://instructure-uploads.s3.amazonaws.com/account_192470000000000001/attachments/1889/favicon.png"> -->
</head>
<body>
    <h1 id="title">CSS Basics</h1>
    <p>Instructions for life:</p>

    <ul>
        <!-- unordered list -->
         <li>Eat</li>
         <li>Sleep</li>
         <li>Repeat</li>
    </ul>

    <h1>CSS Selectors</h1>

    <p>Type of buttons (Class Selectors)</p>
    <button class="btn-confirm">Confirmar</button>
    <button class="btn-destroy">Destruir</button>
    <button class="btn-confirm">Confirmar 2</button>

    <h2>Forms</h2>

    <form>
        <input type="text" placeholder="Email">
        <input type="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>
</body>
